<script type="module">
import * as THREE from 'three';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

// =====================================================================
// Utilities
// =====================================================================
let seed = 1337;
const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
const rand = (a, b) => a + rnd() * (b - a);
const V = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
const mix = (a, b, t) => a + (b - a) * t;
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
function hash(x, y) { const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s); }
function vnoise(x, y, P = 0) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const w = v => P ? ((v % P) + P) % P : v;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash(w(xi), w(yi)), b = hash(w(xi + 1), w(yi)), c = hash(w(xi), w(yi + 1)), d = hash(w(xi + 1), w(yi + 1));
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function fbm(x, y, oct = 5, P = 0) { let s = 0, a = 0.5, f = 1; for (let i = 0; i < oct; i++) { s += a * vnoise(x * f, y * f, P ? P * f : 0); f *= 2; a *= 0.5; } return s; }
function pixTex(size, fn, srgb = true) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d'), img = g.createImageData(size, size);
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    const o = fn(x / size, y / size, x, y), i = (y * size + x) * 4;
    img.data[i] = o[0]; img.data[i + 1] = o[1]; img.data[i + 2] = o[2]; img.data[i + 3] = o[3] ?? 255;
  }
  g.putImageData(img, 0, 0); return canvasToTex(c, srgb);
}
function drawTex(size, draw, srgb = true) { const c = document.createElement('canvas'); c.width = c.height = size; draw(c.getContext('2d'), size); return canvasToTex(c, srgb); }
function canvasToTex(c, srgb) { const t = new THREE.CanvasTexture(c); if (srgb) t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 8; return t; }

// Merge every static mesh under `root` into one mesh per material (huge draw-call saving).
// Children flagged userData.keep (moving parts) are left alone.
function bake(root) {
  root.updateMatrixWorld(true);
  const inv = root.matrixWorld.clone().invert(), buckets = new Map(), kill = [];
  (function walk(o) {
    for (const c of o.children) {
      if (c.userData.keep) continue;
      if (c.isMesh && !c.isInstancedMesh) {
        let g = c.geometry.index ? c.geometry.toNonIndexed() : c.geometry.clone();
        for (const k of Object.keys(g.attributes)) if (!['position', 'normal', 'uv'].includes(k)) g.deleteAttribute(k);
        if (!g.attributes.uv) g.setAttribute('uv', new THREE.Float32BufferAttribute(new Float32Array(g.attributes.position.count * 2), 2));
        if (!g.attributes.normal) g.computeVertexNormals();
        g.applyMatrix4(new THREE.Matrix4().multiplyMatrices(inv, c.matrixWorld));
        if (!buckets.has(c.material)) buckets.set(c.material, { geos: [], cast: false, recv: false });
        const b = buckets.get(c.material); b.geos.push(g); b.cast ||= c.castShadow; b.recv ||= c.receiveShadow; kill.push(c);
      }
      walk(c);
    }
  })(root);
  kill.forEach(c => c.parent.remove(c));
  for (const [mat, b] of buckets) { const m = new THREE.Mesh(mergeGeometries(b.geos), mat); m.castShadow = b.cast; m.receiveShadow = b.recv; root.add(m); }
  return root;
}
const mk = (geo, mat, pos, parent, rot, scl) => { const m = new THREE.Mesh(geo, mat); if (pos) m.position.set(...pos); if (rot) m.rotation.set(...rot); if (scl) m.scale.set(...scl); parent.add(m); return m; };

// =====================================================================
// Atmosphere: one haze function shared by sky, fog and particles
// =====================================================================
const SUN_DIR = V(-0.82, 0.075, -0.56).normalize();
const SUN_GLSL = `vec3(${SUN_DIR.x.toFixed(4)},${SUN_DIR.y.toFixed(4)},${SUN_DIR.z.toFixed(4)})`;
const HAZE_GLSL = `
vec3 hazeCol(vec3 d){
  float s = pow(max(dot(d, ${SUN_GLSL}), 0.), 3.);
  return mix(vec3(0.42,0.27,0.22), vec3(1.0,0.50,0.20), s) + vec3(1.0,0.65,0.35)*pow(max(dot(d, ${SUN_GLSL}),0.),24.)*0.35;
}
float hazeAmt(vec3 wp, float depth, float dens){
  float f = 1. - exp(-dens*dens*depth*depth);
  return f * mix(0.55, 1., exp(-max(wp.y, 0.)*0.012));
}`;
// Patch Three's fog chunks: aerial perspective (warm toward the sun, cool away, thinner aloft)
THREE.ShaderChunk.fog_pars_vertex = `#ifdef USE_FOG\n varying float vFogDepth; varying vec3 vFogW;\n#endif`;
THREE.ShaderChunk.fog_vertex = `#ifdef USE_FOG\n vFogDepth = -mvPosition.z; vFogW = (inverse(viewMatrix) * mvPosition).xyz;\n#endif`;
THREE.ShaderChunk.fog_pars_fragment = `#ifdef USE_FOG\n uniform vec3 fogColor; varying float vFogDepth; varying vec3 vFogW; uniform float fogDensity;\n ${HAZE_GLSL}\n#endif`;
THREE.ShaderChunk.fog_fragment = `#ifdef USE_FOG\n { vec3 fd = normalize(vFogW - cameraPosition); gl_FragColor.rgb = mix(gl_FragColor.rgb, hazeCol(fd), hazeAmt(vFogW, vFogDepth, fogDensity)); }\n#endif`;
// Fake fire lighting: up to 8 flickering fire sources lighting nearby surfaces (cheap; no real point lights)
const FIRES = { value: Array.from({ length: 8 }, () => new THREE.Vector4(0, -999, 0, 0)) };
THREE.ShaderChunk.lights_pars_begin += `\nuniform vec4 fires[8];\n`;
THREE.ShaderChunk.lights_fragment_end = `
for (int i = 0; i < 8; i++) {
  if (fires[i].w <= 0.) continue;
  vec3 fp = (viewMatrix * vec4(fires[i].xyz, 1.)).xyz - geometryPosition;
  float d = length(fp); vec3 L = fp / d;
  float att = fires[i].w / (1. + d * d * 0.012);
  reflectedLight.directDiffuse += material.diffuseColor * vec3(1.0, 0.42, 0.12) * att * max(dot(geometryNormal, L) * 0.8 + 0.2, 0.);
}
` + THREE.ShaderChunk.lights_fragment_end;
const fireSlots = [];
function addFireLight(p, power) { if (fireSlots.length < 5) fireSlots.push({ p: p.clone(), power }); }

// =====================================================================
// Procedural textures
// =====================================================================
const groundTex = pixTex(512, (u, v) => {
  const n = fbm(u * 8, v * 8, 5, 8), d = fbm(u * 32 + 3, v * 32, 3, 32), g = fbm(u * 4 + 9, v * 4, 4, 4);
  let r = mix(58, 92, n), gg = mix(50, 80, n), b = mix(42, 64, n);
  const grass = smooth(0.5, 0.64, g) * smooth(0.3, 0.7, d);
  r = mix(r, 104, grass); gg = mix(gg, 94, grass); b = mix(b, 60, grass);
  const pebble = vnoise(u * 180, v * 180, 180) > 0.84 ? 0.7 : 1;
  const k = (0.8 + d * 0.4) * pebble; return [r * k, gg * k, b * k];
});
const groundBump = pixTex(256, (u, v) => { const h = fbm(u * 6, v * 6, 5, 6); return [h * 255, h * 255, h * 255]; }, false);
const burlapTex = pixTex(512, (u, v, x, y) => {
  const wx = (x % 8) < 4, wy = (y % 8) < 4, thread = (wx !== wy) ? 1 : 0.82;
  const fib = 0.9 + 0.1 * hash(x, y);
  const stain = fbm(u * 3, v * 3, 4, 3), mud = smooth(0.55, 0.75, fbm(u * 5 + 4, v * 5, 4, 5));
  const seam = Math.abs(u - 0.5) < 0.006 ? 0.6 : 1;
  const k = thread * fib * (0.75 + stain * 0.4) * seam;
  return [mix(128, 70, mud) * k, mix(112, 60, mud) * k, mix(84, 46, mud) * k];
});
const burlapBump = pixTex(128, (u, v, x, y) => { const c = ((x % 8) < 4) !== ((y % 8) < 4) ? 200 : 90; return [c, c, c]; }, false);
// Olive-drab painted steel: low-frequency mottle, chips only in roughness, vertical drip streaks
const paintTex = pixTex(512, (u, v) => {
  const n = fbm(u * 5, v * 5, 5, 5), chip = fbm(u * 36, v * 36, 3, 36);
  let c = [68, 76, 60].map(x => x * (0.82 + n * 0.32));
  if (chip > 0.7) c = [88, 84, 78];
  const drip = smooth(0.62, 0.8, fbm(u * 40, v * 2.5, 3, 40)) * smooth(0, 0.6, v);
  return c.map(x => x * (1 - drip * 0.3));
});
const paintRough = pixTex(256, (u, v) => { const chip = fbm(u * 18, v * 18, 3, 18); const c = chip > 0.7 ? 80 : 190; return [c, c, c]; }, false);
const woodTex = pixTex(512, (u, v) => {
  const grain = Math.sin((v * 40 + fbm(u * 3, v * 6, 4) * 3) * Math.PI) * 0.5 + 0.5;
  const knot = smooth(0.78, 0.86, fbm(u * 8, v * 3, 3));
  const mud = smooth(0.5, 0.75, fbm(u * 4 + 7, v * 4, 4));
  const k = (0.75 + grain * 0.25) * (1 - knot * 0.35);
  return [mix(84, 56, mud) * k, mix(66, 46, mud) * k, mix(48, 36, mud) * k];
});
const rustTex = pixTex(512, (u, v) => {
  const n = fbm(u * 6, v * 6, 5, 6), m = fbm(u * 20 + 3, v * 20, 3, 20);
  let c = n > 0.55 ? [110, 58, 32] : n > 0.42 ? [70, 52, 40] : [34, 30, 28];
  if (m > 0.62) c = [96, 92, 88];          // pale ash
  return c.map(x => x * (0.85 + m * 0.3));
});
const brickTex = pixTex(512, (u, v) => {
  const rows = 16, cols = 8, row = Math.floor(v * rows), off = row % 2 ? 0.5 : 0;
  const bx = (u * cols + off) % 1, by = (v * rows) % 1, mortar = bx < 0.05 || by < 0.09;
  const n = fbm(u * 6, v * 6, 4, 6);
  const k = mortar ? 0.55 : 0.7 + hash(Math.floor(u * cols + off), row) * 0.35;
  const soot = smooth(0.35, 0.8, n) * 0.7;
  return [142 * k * (1 - soot), 100 * k * (1 - soot), 80 * k * (1 - soot)];
});
const barkTex = pixTex(256, (u, v) => { const s = fbm(u * 40, v * 3, 4, 40); const k = 0.5 + s * 0.6; return [52 * k, 42 * k, 34 * k]; });

// Aircraft: hard-edged splinter camo + panel lines + rivets + grime
function skinTex(c1, c2, c3, belly) {
  return pixTex(512, (u, v, x, y) => {
    const w = (vnoise(u * 6, v * 6) - 0.5) * 0.12;
    const s1 = ((u * 1.0 + v * 1.7) * 3 + w) % 1 < 0.5, s2 = ((u * 2.3 - v * 0.9 + 4) * 2.5 + w) % 1 < 0.45;
    let c = s1 ? (s2 ? c1 : c2) : (s2 ? c3 : c1);
    if (belly && Math.abs(u - 0.5) < 0.2) c = belly;               // underside band
    const frame = Math.abs(((v * 16) % 1) - 0.5) > 0.485, stringer = Math.abs(((u * 10) % 1) - 0.5) > 0.49;
    const rivet = (Math.abs(((v * 16) % 1) - 0.5) > 0.46 && (x % 6) < 2) ? 0.8 : 1;
    const grime = 0.82 + fbm(u * 18, v * 18, 3) * 0.3;
    const exhaust = smooth(0.6, 0.9, v) * smooth(0.25, 0.0, Math.abs(Math.abs(u - 0.5) - 0.25)) * 0.45;
    const k = grime * (frame || stringer ? 0.62 : 1) * rivet * (1 - exhaust);
    return c.map(t => t * k);
  });
}
function wingTex(c1, c2, tip, markFn) {
  const t = pixTex(512, (u, v, x, y) => {
    const w = (vnoise(u * 8, v * 8) - 0.5) * 0.1;
    let c = ((u * 2.1 + v * 1.3) * 3 + w) % 1 < 0.5 ? c1 : c2;
    if (u < 0.05 || u > 0.95) c = tip;
    const panel = Math.abs(((u * 12) % 1) - 0.5) > 0.488 || (v > 0.72 && v < 0.735 && Math.abs(u - 0.5) > 0.12);
    const grime = 0.85 + fbm(u * 20, v * 20, 3) * 0.25;
    return c.map(t => t * grime * (panel ? 0.62 : 1));
  });
  const g = t.image.getContext('2d'); markFn(g, 512 * 0.2, 512 * 0.45, 60); markFn(g, 512 * 0.8, 512 * 0.45, 60); t.needsUpdate = true; return t;
}
// Generic invented insignia (not any real nation's)
const enemyMarkFn = (g, x, y, r) => { g.fillStyle = '#141414'; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); g.fillStyle = '#a8963a'; g.beginPath(); g.arc(x, y, r * 0.74, 0, 7); g.fill(); g.fillStyle = '#7a1612'; g.beginPath(); g.moveTo(x, y - r * 0.55); g.lineTo(x + r * 0.5, y + r * 0.35); g.lineTo(x - r * 0.5, y + r * 0.35); g.fill(); };
const friendMarkFn = (g, x, y, r) => { [['#d8d4c8', 1], ['#24427e', 0.78], ['#d8d4c8', 0.38]].forEach(([c, k]) => { g.fillStyle = c; g.beginPath(); g.arc(x, y, r * k, 0, 7); g.fill(); }); };
const markTex = fn => drawTex(128, (g, s) => { g.clearRect(0, 0, s, s); fn(g, s / 2, s / 2, s * 0.46); });

// Particle atlas: 2x2 cells — smoke, flame, glow, streak
const ATLAS = pixTex(512, (u, v) => {
  const cu = u < 0.5 ? 0 : 1, cv = v < 0.5 ? 0 : 1, lu = (u * 2) % 1, lv = (v * 2) % 1;
  const dx = lu - 0.5, dy = lv - 0.5, r = Math.sqrt(dx * dx + dy * dy) * 2;
  if (cu === 0 && cv === 0) { // smoke
    const n = fbm(lu * 5 + 1, lv * 5 + 2, 6), a = clamp((1 - r) * 1.7 - 0.3 + (n - 0.5) * 1.4);
    const sh = 150 + n * 105 - dy * 70; return [sh, sh, sh, a * 255];
  }
  if (cu === 1 && cv === 0) { // flame
    const n = fbm(lu * 6, lv * 6 + 3, 5), a = clamp(1 - Math.sqrt(dx * dx * 1.8 + dy * dy) * 2 + (n - 0.5) * 1.0);
    return [255, 140 + 115 * a, 40 * a * a, a * 255];
  }
  if (cu === 0 && cv === 1) { // glow
    const a = Math.pow(clamp(1 - r), 2.2); return [255, 225 + 30 * a, 180 + 75 * a, a * 255];
  }
  const a = Math.pow(clamp(1 - Math.abs(dx) * 2.4), 2) * Math.pow(lv, 1.6); // streak: hot head at top
  return [255, 200 + 55 * lv, 120 + 135 * lv * lv, a * 255];
}, true);
ATLAS.wrapS = ATLAS.wrapT = THREE.ClampToEdgeWrapping;
const grassTex = drawTex(128, (g, s) => {
  g.clearRect(0, 0, s, s);
  for (let i = 0; i < 40; i++) {
    const x = rand(10, s - 10), h = rand(s * 0.35, s * 0.95), lean = rand(-18, 18), t = rnd();
    g.strokeStyle = `rgb(${mix(118, 160, t) | 0},${mix(104, 132, t) | 0},${mix(62, 78, t) | 0})`;
    g.lineWidth = rand(1, 2.2); g.beginPath(); g.moveTo(x, s); g.quadraticCurveTo(x + lean * 0.3, s - h * 0.6, x + lean, s - h); g.stroke();
  }
});

// =====================================================================
// Renderer, sky bake, environment reflections
// =====================================================================
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.92;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x806050, 0.0034);
const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 2500);
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false,
  vertexShader: `varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
  fragmentShader: `
    varying vec3 vP;
    ${HAZE_GLSL}
    float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
    float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}
    float fbm(vec2 p){float s=0.,a=.5;for(int i=0;i<7;i++){s+=a*n(p);p=p*2.02+vec2(1.7,9.2);a*=.5;}return s;}
    void main(){
      vec3 d = normalize(vP); float y = d.y, sd = max(dot(d, ${SUN_GLSL}), 0.);
      vec3 col = hazeCol(d);
      col = mix(col, vec3(0.26,0.13,0.11), smoothstep(0.03,0.22,y));
      col = mix(col, vec3(0.05,0.05,0.07), smoothstep(0.16,0.6,y));
      col += vec3(1.,.38,.1)*pow(sd,5.)*0.45 + vec3(1.,.62,.3)*pow(sd,30.)*0.6 + vec3(1.,.95,.8)*pow(sd,1200.)*8.;
      vec2 uv = d.xz/(y+0.08);
      float c1 = fbm(uv*0.9), c2 = fbm(uv*2.7 + 3.);
      float cov = smoothstep(0.36,0.72,c1) * smoothstep(-0.01,0.12,y);
      vec3 lit = mix(vec3(0.8,0.3,0.12), vec3(1.0,0.62,0.32), pow(sd,4.));
      vec3 cc = mix(vec3(0.05,0.04,0.04), lit, clamp((1.-c1)*1.3*(0.2+pow(sd,2.)*1.6) + (1.-smoothstep(0.,.2,y))*0.35, 0., 1.));
      col = mix(col, cc, clamp(cov*(0.85 + smoothstep(0.4,0.8,c2)*0.15), 0., 0.95));
      col += vec3(1.,.6,.3)*pow(sd,10.)*cov*(1.-c1)*1.6;
      col = mix(col, hazeCol(d)*0.8, 1.-smoothstep(-0.05,0.02,y));
      gl_FragColor = vec4(col,1.);
    }`
});
{ // Bake the sky once into a cubemap: background + image-based lighting/reflections for every material
  const skyScene = new THREE.Scene(); skyScene.add(new THREE.Mesh(new THREE.SphereGeometry(100, 64, 32), skyMat));
  const rt = new THREE.WebGLCubeRenderTarget(1024, { type: THREE.HalfFloatType });
  const cc = new THREE.CubeCamera(1, 1000, rt); cc.update(renderer, skyScene);
  scene.background = rt.texture;
  const pm = new THREE.PMREMGenerator(renderer); scene.environment = pm.fromCubemap(rt.texture).texture;
}

// Lighting: low warm sun + cool sky fill, no frontal fill so things fall into dusk silhouette
scene.add(new THREE.HemisphereLight(0x5c6272, 0x24180f, 0.5));
const sun = new THREE.DirectionalLight(0xff9450, 4.0);
sun.position.copy(SUN_DIR).multiplyScalar(60); sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024); sun.shadow.bias = -0.0005; sun.shadow.normalBias = 0.02;
Object.assign(sun.shadow.camera, { left: -7, right: 7, top: 7, bottom: -7, near: 20, far: 120 });
scene.add(sun);

// =====================================================================
// Terrain
// =====================================================================
const craters = [];
for (let i = 0; i < 90; i++) { const a = rand(0, 6.28), d = rand(12, 320); craters.push([Math.cos(a) * d, Math.sin(a) * d - 60, rand(2.5, 8)]); }
function heightAt(x, z) {
  const d = Math.hypot(x, z);
  let h = (fbm(x * 0.006, z * 0.006, 5) - 0.5) * 22 * smooth(6, 140, d);
  h += (fbm(x * 0.05, z * 0.05, 3) - 0.5) * 1.0 * smooth(5, 20, d);
  h += smooth(500, 1400, d) * 140 * (fbm(x * 0.0025 + 9, z * 0.0025, 4) - 0.25);
  for (const [cx, cz, r] of craters) { const q = Math.hypot(x - cx, z - cz) / r; if (q < 1) h -= (1 - q * q) * r * 0.32; else if (q < 1.7) h += Math.sin((q - 1) / 0.7 * Math.PI) * r * 0.12; }
  return h;
}
const groundGeo = new THREE.PlaneGeometry(4000, 4000, 220, 220); groundGeo.rotateX(-Math.PI / 2);
{
  const p = groundGeo.attributes.position, cols = [];
  for (let i = 0; i < p.count; i++) {
    let x = p.getX(i), z = p.getZ(i);
    const d = Math.hypot(x, z), k = d > 0 ? Math.pow(d / 2828, 2.4) * 2828 / d : 0; x *= k; z *= k;
    p.setXYZ(i, x, heightAt(x, z), z);
    let burnt = 0, rim = 0;
    for (const [cx, cz, r] of craters) { const q = Math.hypot(x - cx, z - cz) / r; burnt = Math.max(burnt, 1 - q / 1.4); rim = Math.max(rim, q > 1 && q < 1.7 ? 1 - Math.abs(q - 1.3) / 0.4 : 0); }
    const m = fbm(x * 0.01 + 4, z * 0.01, 4);
    const c = new THREE.Color().setRGB(mix(0.85, 1.12, m), mix(0.85, 1.08, m), mix(0.85, 1.0, m));
    c.lerp(new THREE.Color(1.35, 1.25, 1.1), clamp(rim) * 0.35);           // lighter thrown-up subsoil
    c.multiplyScalar(1 - clamp(burnt) * 0.65);                               // scorched crater floors
    cols.push(c.r, c.g, c.b);

    if (P.ammo <= 0) { if (P.reserve > 0) startReload(); else if (P.cool < -0.4) { sfx('click', { vol: 0.6 }); P.cool = 0.3; } }
    else {
      P.cool = 1 / P.rof; P.ammo--; P.shots++;
      scene.updateMatrixWorld();
      const m = barrels[barrelIdx], mp = m.getWorldPosition(V()), dir = V(0, 0, -1).applyQuaternion(m.getWorldQuaternion(tmpQ));
      fireShell(mp, dir); fxMuzzle(mp, dir); recoil[barrelIdx] = 0.16; barrelIdx ^= 1;
      sfx('gun', { vol: 0.9, rate: rand(0.94, 1.06) }); if (rnd() < 0.3) setTimeout(() => sfx('tink', { vol: 0.5, rate: rand(0.8, 1.3) }), 400 + rnd() * 300);
      flashLight.position.copy(mp); flashLight.intensity = 40; haptic(0.5, 45);
      if (state === 'wave' && P.ammo === 0 && P.reserve > 0) startReload();
    }
  }
  flashLight.intensity = Math.max(0, flashLight.intensity - dt * 600);
  // reticle at 350 m along the barrel axis
  scene.updateMatrixWorld();
  const bd = V(0, 0, -1).applyQuaternion(barrels[0].getWorldQuaternion(tmpQ));
  const rp = V().addVectors(barrels[0].getWorldPosition(tv2), barrels[1].getWorldPosition(V())).multiplyScalar(0.5).addScaledVector(bd, 350);
  ret.position.copy(rp); ret.lookAt(camWorld); ret.scale.setScalar(camWorld.distanceTo(rp) * 0.018);
  ret.visible = state === 'wave' || state === 'countdown';
  // lead pip for the enemy closest to the reticle
  let best = null, bestA = 0.35;
  for (const a of aircraft) { if (a.friendly || a.dying) continue; const ang = bd.angleTo(tv1.copy(a.pos).sub(camWorld)); if (ang < bestA) { bestA = ang; best = a; } }
  lead.visible = !!best && ret.visible;
  if (best) {
    let t = best.pos.distanceTo(camWorld) / P.muzzle; const lp = V();
    for (let k = 0; k < 3; k++) { lp.copy(best.pos).addScaledVector(best.fwd, best.speed * t).add(V(0, 0.5 * G * t * t, 0)); t = lp.distanceTo(camWorld) / P.muzzle; }
    lead.position.copy(lp); lead.lookAt(camWorld); lead.scale.setScalar(lp.distanceTo(camWorld) * 0.01);
  }
  hud.hitMark.position.copy(rp); hud.hitMark.lookAt(camWorld); hud.hitMark.scale.setScalar(camWorld.distanceTo(rp) * 0.02);
}
let touchFire = false, holdFire = false, calib = 0, rigYaw = 0, smoothTurn = false;
const calOff = V();
function applyRig() { rig.rotation.y = rigYaw; rig.position.copy(calOff).applyAxisAngle(UP, rigYaw); rig.updateMatrixWorld(true); }

// ---------------------------------------------------------------------
// Waves & game flow
// ---------------------------------------------------------------------
let state = 'title', pendingMenu = null;
const waveState = { remaining: 0, queue: [], spawnT: 0, friendT: 0, countdown: 0, friendsLeft: 0, emergency: false };
function startGame() {
  resetPlayer(); P.wave = 0;
  [...aircraft].forEach(a => a.remove()); bombs.forEach(b => scene.remove(b.m)); bombs.length = 0; crates.forEach(c => scene.remove(c.m)); crates.length = 0;
  shells.forEach(s => s.p.age = s.p.life); shells.length = 0; bullets.forEach(b => b.p.age = b.p.life); bullets.length = 0;
  menu.hide(); pendingMenu = null; nextWave();
}
function nextWave() {
  P.wave++; state = 'countdown'; waveState.countdown = 6;
  const n = P.wave, fighters = 2 + n * 2, bombersN = n >= 2 ? Math.floor(n / 2) + (n >= 6 ? 1 : 0) : 0;
  waveState.queue = []; for (let i = 0; i < fighters; i++) waveState.queue.push('enemy'); for (let i = 0; i < bombersN; i++) waveState.queue.splice((rnd() * (waveState.queue.length + 1)) | 0, 0, 'bomber');
  waveState.remaining = fighters + bombersN; waveState.spawnT = 0; waveState.friendsLeft = 1 + (n >= 3 ? 1 : 0); waveState.friendT = rand(15, 25); waveState.emergency = false;
  if (n > 1) P.reserve += 120;
  hud.flash(`WAVE ${n} — ${fighters} FIGHTERS${bombersN ? `, ${bombersN} BOMBER${bombersN > 1 ? 'S' : ''}` : ''}`, '#ffcf6a');
  sfx('siren', { vol: 0.55 });
}
function maxAlive() { return 2 + Math.floor(P.wave / 2); }
function updateWave(dt) {
  if (state === 'countdown') { waveState.countdown -= dt; if (waveState.countdown <= 0) state = 'wave'; return; }
  if (state !== 'wave') return;
  waveState.spawnT -= dt;
  const alive = aircraft.filter(a => !a.friendly && !a.dying).length;
  if (waveState.queue.length && waveState.spawnT <= 0 && alive < maxAlive()) { spawnPlane(waveState.queue.shift()); waveState.spawnT = rand(3, 7) / Math.sqrt(P.wave); }
  waveState.friendT -= dt;
  const needy = (P.hp < P.maxHp * 0.35 || P.reserve + P.ammo < 60) && !waveState.emergency;
  if ((waveState.friendT <= 0 && waveState.friendsLeft > 0) || needy) { if (needy) waveState.emergency = true; else waveState.friendsLeft--; spawnPlane('friend'); waveState.friendT = rand(25, 40); }
  if (waveState.remaining <= 0 && !waveState.queue.length && !aircraft.some(a => !a.friendly && !a.dying)) waveCleared();
}
function waveCleared() {
  state = 'upgrade'; P.score += 200 * P.wave; sfx('pickup', { vol: 0.8, rate: 0.8 });
  const pool = [...UPGRADES].sort(() => rnd() - 0.5).slice(0, 3);
  pendingMenu = { at: clock.t + 2.5, fn: () => { exitLock(); mouseDown = false; menu.show(`WAVE ${P.wave} CLEARED`, `Bonus +${200 * P.wave}.  Choose an upgrade:`, pool, i => { pool[i].apply(); P.upgrades.push(pool[i].id); menu.hide(); nextWave(); }); } };
}
function gameOver() {
  state = 'gameover'; exitLock(); mouseDown = false;
  sfx('boom', { vol: 1.5, rate: 0.7 });
  const acc = P.shots ? Math.round(100 * P.hits / P.shots) : 0;
  pendingMenu = { at: clock.t + 1.8, fn: () => menu.show('GUN POSITION LOST', `Wave ${P.wave}  ·  Score ${Math.round(P.score)}  ·  Kills ${P.kills}  ·  Hit rate ${acc}%`, [{ name: 'Fight again', desc: 'Restart from wave 1' }], () => startGame()) };
}
function exitLock() { if (document.pointerLockElement) document.exitPointerLock?.(); }
function showTitle() {
  state = 'title';
  menu.show('FLAK DEFENSE', 'Hold the gun pit. Shoot down fighters and bombers.\nBlue-marked planes are friendly: they drop supplies.', [
    { name: 'Start', desc: 'Point & hold trigger to fire. Thumbstick turns you and the gun. A/X reload, B/Y recenter.' },
  ], () => startGame());
}

// ---------------------------------------------------------------------
// Ambient life on the title screen & between waves: distant artillery
// ---------------------------------------------------------------------
let artT = 3;
function ambient(dt) {
  artT -= dt;
  if (artT <= 0) {
    artT = rand(2, 7); const a = rand(0, 6.28), d = rand(350, 700), p = V(Math.cos(a) * d, 0, Math.sin(a) * d); p.y = heightAt(p.x, p.z);
    emit({ kind: 'glow', cell: 2, add: 1, pos: p.clone().add(V(0, 4, 0)), size: rand(18, 30), life: 0.25 });
    for (let i = 0; i < 4; i++) emit({ kind: 'dust', cell: 0, pos: p.clone().add(V(rand(-4, 4), rand(2, 8), rand(-4, 4))), vel: V(0, rand(3, 8), 0), size: rand(6, 10), grow: 2, life: rand(6, 10), alpha: 0.7, ground: p.y });
    setTimeout(() => sfx('boom', { pos: p, vol: 1.4, ref: 200, rate: rand(0.5, 0.75) }), d / 343 * 1000);
  }
}

// ---------------------------------------------------------------------
// Main update
// ---------------------------------------------------------------------
const tmpDir = V();
function update(dt) {
  clock.t += dt;
  const xr = renderer.xr.isPresenting;
  // aim direction source
  let aimDir;
  if (xr) {
    const s = ctrls[activeHand].held ? ctrls[activeHand] : (ctrls.find(c => c.held) || ctrls[activeHand]);
    if (s.held) activeHand = ctrls.indexOf(s);
    triggerHeld = ctrls.some(c => c.held); if (!triggerHeld) holdFire = false; if (holdFire) triggerHeld = false;
    if (calib < 12) { calib++; calOff.set(HEAD.x - camera.position.x, HEAD.y - camera.position.y, HEAD.z - camera.position.z); applyRig(); }
    // thumbstick turning: the seat and gun swing round together (snap 30° by default, click stick for smooth)
    for (const st of ctrls) {
      const ax = st.gp?.axes || [], x = Math.abs(ax[2] || 0) > Math.abs(ax[0] || 0) ? (ax[2] || 0) : (ax[0] || 0);
      const click = st.gp?.buttons?.[3]?.pressed;
      if (click && !st.btnS) { smoothTurn = !smoothTurn; hud.flash(smoothTurn ? 'SMOOTH TURNING' : 'SNAP TURNING', '#d8c7a0'); }
      st.btnS = !!click;
      if (smoothTurn) { if (Math.abs(x) > 0.15) { rigYaw -= x * 1.4 * dt; applyRig(); } }
      else { if (Math.abs(x) > 0.7 && st.stickReady !== false) { rigYaw -= Math.sign(x) * Math.PI / 6; st.stickReady = false; applyRig(); sfx('click', { vol: 0.4, rate: 0.7 }); } else if (Math.abs(x) < 0.3) st.stickReady = true; }
    }
    const c = ctrls[activeHand].c; c.updateMatrixWorld();
    aimDir = V(0, 0, -1).applyQuaternion(c.getWorldQuaternion(tmpQ));
    // A/X reload
    for (const st of ctrls) { const b = st.gp?.buttons?.[4]?.pressed, b2 = st.gp?.buttons?.[5]?.pressed; if (b && !st.btnA && (state === 'wave' || state === 'countdown')) startReload(); if (b2 && !st.btnB) calib = 0; st.btnA = !!b; st.btnB = !!b2; st.laser.visible = menu.open || state === 'title'; st.laser.scale.set(1, 1, menu.open ? 3 : 0.6); }
    camera.getWorldPosition(camWorld);
    if (menu.open) { const c2 = ctrls[activeHand].c; raycaster.ray.origin.setFromMatrixPosition(c2.matrixWorld); raycaster.ray.direction.copy(V(0, 0, -1).applyQuaternion(c2.getWorldQuaternion(tmpQ))); const h = raycaster.intersectObject(menu.mesh)[0]; menu.hoverAt(h?.uv); }
  } else {
    camera.rotation.set(aimPitch, aimYaw, 0, 'YXZ');
    if (shake > 0) { camera.rotation.x += rand(-1, 1) * shake * 0.02; camera.rotation.y += rand(-1, 1) * shake * 0.02; }
    camera.updateMatrixWorld(); camera.getWorldPosition(camWorld);
    aimDir = V(0, 0, -1).applyQuaternion(camera.getWorldQuaternion(tmpQ));
  }
  shake = Math.max(0, shake - dt * 1.5);
  if (state === 'wave' || state === 'countdown') updateGun(dt, aimDir); else { flashLight.intensity = 0; ret.visible = lead.visible = false; }
  updateWave(dt);
  if (pendingMenu && clock.t >= pendingMenu.at) { const f = pendingMenu.fn; pendingMenu = null; f(); }
  for (const a of [...aircraft]) a.update(dt);
  updateProjectiles(dt);
  runDynEmitters(dt); runEmitters(dt); ambient(dt);
  updateParticles(dt, camera);
  hud.update(dt, camWorld, aimFlatDir(), xr);
  // fires flicker + explosion lights
  fireSlots.forEach((f, i) => FIRES.value[i].w = f.power * (0.75 + 0.5 * Math.abs(Math.sin(clock.t * 13 + i) * Math.sin(clock.t * 5.1 + i * 2))));
  dynFires.forEach((f, i) => { const v = FIRES.value[5 + i]; if (f.until > clock.t) { const k = 1 - (clock.t - f.start) / f.dur; v.set(f.p.x, f.p.y, f.p.z, f.power * (f.dur > 3 ? 0.4 + 0.3 * Math.abs(Math.sin(clock.t * 11 + i)) : k * k)); } else v.w = 0; });
  // hurt feedback & low-health heartbeat
  P.hurt = Math.max(0, P.hurt - dt * 1.2); hurtSphere.material.opacity = P.hurt * 0.45 + (state === 'wave' && P.hp < P.maxHp * 0.25 ? 0.12 + 0.08 * Math.sin(clock.t * 6) : 0);
  if (state === 'wave' && P.hp < P.maxHp * 0.25) { if (!P.beatT || clock.t > P.beatT) { P.beatT = clock.t + 0.9; sfx('beat', { vol: 0.7 }); } }
}

// ---------------------------------------------------------------------
// Start screens: HTML overlay (desktop) + Enter VR
// ---------------------------------------------------------------------
const ui = document.createElement('div');
ui.innerHTML = `
<style>
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(0,0,0,.35),rgba(0,0,0,.75));font-family:system-ui,sans-serif;color:#eadcb8;z-index:10}
#ov .box{max-width:560px;padding:28px 32px;background:rgba(18,14,10,.85);border:1px solid rgba(220,190,130,.35);border-radius:16px;text-align:center}
#ov h1{margin:0 0 6px;font-size:40px;letter-spacing:4px}
#ov p{color:#c8b898;line-height:1.5;margin:10px 0}
#ov button{font-size:20px;margin:8px;padding:14px 26px;border-radius:10px;border:1px solid #e3b23c;background:#3a2c14;color:#ffe2a0;cursor:pointer}
#ov button:disabled{opacity:.4;cursor:default}
#ov small{color:#8a7a60}
#fireBtn{position:fixed;right:22px;bottom:22px;width:110px;height:110px;border-radius:50%;background:rgba(200,60,30,.55);border:3px solid rgba(255,200,150,.7);color:#fff;font:bold 20px system-ui;display:none;z-index:5;user-select:none;-webkit-user-select:none;touch-action:none}
#sndBtn{position:fixed;left:14px;top:14px;z-index:15;padding:8px 14px;border-radius:20px;border:1px solid rgba(255,220,160,.5);background:rgba(20,15,10,.6);color:#ffe2a0;font:15px system-ui}
#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#120d09;color:#c8b898;font:18px system-ui;z-index:20}
</style>
<div id="ov"><div class="box">
<h1>FLAK DEFENSE</h1>
<p>You man a twin anti-aircraft gun in a sandbagged pit. Enemy fighters strafe you and bombers drop bombs. Friendly planes (blue markers) drop health, ammo and upgrade crates. Don't shoot them!</p>
<p><b>Quest:</b> point a controller and hold the trigger to fire. Flick the thumbstick left/right to turn (click it for smooth turning). A/X reloads, B/Y recenters.<br><b>Desktop:</b> click to aim with the mouse, hold the button to fire, R to reload.</p>
<button id="vrBtn" disabled>Checking VR…</button><button id="deskBtn">Play on this screen</button>
<p><small id="vrNote"></small></p><p><small>No sound on iPhone? Turn off silent mode (the switch on the side) and turn the volume up.</small></p>
</div></div>
<button id="fireBtn">FIRE</button><button id="sndBtn">🔈 Tap for sound</button>`;
document.body.appendChild(ui);
const $ = id => document.getElementById(id);
$('sndBtn').addEventListener('click', e => { e.stopPropagation(); if (!SND.ok || SND.listener.context.state !== 'running') { muted = false; unlockAudio(); } else { muted = !muted; SND.listener.setMasterVolume(muted ? 0 : 1); } updateSoundBtn(); sfx('click', { vol: 1 }); });
const vrBtn = $('vrBtn'), deskBtn = $('deskBtn'), ov = $('ov'), fireBtn = $('fireBtn');
fireBtn.addEventListener('touchstart', e => { e.preventDefault(); touchFire = true; }); fireBtn.addEventListener('touchend', () => { touchFire = false; unlockAudio(); }); fireBtn.addEventListener('touchend', () => touchFire = false);
if ('ontouchstart' in window) fireBtn.style.display = 'block';
deskBtn.onclick = () => { unlockAudio(); ov.style.display = 'none'; startGame(); cvs.requestPointerLock?.(); };
async function checkVR() {
  let ok = false;
  try { ok = !!navigator.xr && await navigator.xr.isSessionSupported('immersive-vr'); } catch (e) { ok = false; }
  vrBtn.disabled = !ok; vrBtn.textContent = ok ? 'Enter VR' : 'VR not available here';
  if (!ok) $('vrNote').textContent = navigator.xr ? 'This page cannot start VR here (it may be embedded). Open the page directly in the Quest Browser.' : 'Open this page in the Meta Quest Browser to play in VR.';
}
checkVR();
vrBtn.onclick = async () => {
  unlockAudio();
  try {
    const session = await navigator.xr.requestSession('immersive-vr', { optionalFeatures: ['local-floor', 'bounded-floor', 'hand-tracking'] });
    renderer.xr.setFramebufferScaleFactor(1.0);
    await renderer.xr.setSession(session);
    try { renderer.xr.setFoveation(0.6); } catch (e) { }
    try { if (session.supportedFrameRates?.includes(90)) session.updateTargetFrameRate(90); } catch (e) { }
    ov.style.display = 'none'; fireBtn.style.display = 'none';
    showTitle();
    calib = 0; rigYaw = 0; session.addEventListener('end', () => { ov.style.display = 'flex'; state = 'title'; menu.hide(); rigYaw = 0; rig.rotation.y = 0; rig.position.copy(HEAD); camera.position.set(0, 0, 0); });
  } catch (e) { $('vrNote').textContent = 'Could not start VR: ' + e.message; }
};

// ---------------------------------------------------------------------
// Loop
// ---------------------------------------------------------------------
bindFire(scene);
resetPlayer();
for (let i = 0; i < 200; i++) { runEmitters(1 / 15); updateParticles(1 / 15, camera); }
let last = performance.now();
window.__frames = 0; window.__ctrl = i => ctrls[i].c;
renderer.setAnimationLoop(() => {
  const now = performance.now(), dt = Math.min(0.05, (now - last) / 1000); last = now; window.__frames++;
  update(dt);
  renderer.render(scene, camera);
});
document.getElementById('load')?.remove();

// test hooks (used by automated playtests)
window.__game = {
  get state() { return state; }, get P() { return P; }, aircraft, bombs, crates, shells, waveState, menu, update, startGame, nextWave,
  setAim(y, p) { aimYaw = y; aimPitch = p; }, setFire(v) { mouseDown = v; },
  stop() { renderer.setAnimationLoop(null); }, render() { renderer.render(scene, camera); },
  info() { renderer.render(scene, camera); return { calls: renderer.info.render.calls, tris: renderer.info.render.triangles, particles: live.length, planes: aircraft.length }; },
  snap() { renderer.render(scene, camera); return renderer.domElement.toDataURL('image/png'); },
  snapAt(px, py, pz, tx, ty, tz, fov) { const c = camera.clone(); scene.add(c); c.position.set(px, py, pz); c.fov = fov; c.lookAt(tx, ty, tz); c.updateProjectionMatrix(); c.updateMatrixWorld(); updateParticles(0, c); renderer.render(scene, c); scene.remove(c); return renderer.domElement.toDataURL('image/png'); },
  get rigYaw() { return rigYaw; }, dmgLog, initAudio, get SND() { return SND; }, camWorld, HEAD, PLAYER_POS, get gun() { return { gunYaw, gunPitch }; }, upgrades: UPGRADES, hurtSphere,
};
window.__ready = true;
</script>
